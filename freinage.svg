  <circle cx="400" cy="250" r="70"  fill="#152535" stroke="#f07010" stroke-width="4"/>
  <circle cx="400" cy="250" r="45"  fill="#0a1f38" stroke="#f07010" stroke-width="2"/>
  <!-- Rainures -->
  <g stroke="#f07010" stroke-width="3" opacity=".7">
    <path d="M400 110 Q460 170 420 250"/>
    <path d="M490 160 Q510 230 440 270"/>
    <path d="M450 340 Q380 330 360 260"/>
    <path d="M310 340 Q290 270 360 240"/>
    <path d="M310 160 Q380 170 390 240"/>
