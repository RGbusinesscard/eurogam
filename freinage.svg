<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2540"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f07010;stop-opacity:.25"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#g1)"/>
  <ellipse cx="400" cy="250" rx="320" ry="320" fill="url(#glow)"/>
  <!-- Disque de frein -->
  <circle cx="400" cy="250" r="180" fill="none" stroke="#2a5298" stroke-width="4" opacity=".4"/>
  <circle cx="400" cy="250" r="160" fill="#1e3a5f" stroke="#f07010" stroke-width="6"/>
