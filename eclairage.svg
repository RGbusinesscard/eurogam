<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1f38"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#g3)"/>
  <!-- Courroie de distribution -->
  <rect x="100" y="80" width="600" height="340" rx="170" fill="none" stroke="#f07010" stroke-width="12" stroke-dasharray="28 14" opacity=".7"/>
  <!-- Pignons -->
  <g fill="#1e4d7b" stroke="#f07010" stroke-width="4">
    <circle cx="200" cy="250" r="90"/>
    <circle cx="600" cy="250" r="70"/>
    <circle cx="400" cy="120" r="50"/>
    <circle cx="400" cy="380" r="40"/>
  </g>
  <!-- Dents pignons -->
  <circle cx="200" cy="250" r="70" fill="none" stroke="#f07010" stroke-width="2" stroke-dasharray="12 8" opacity=".5"/>
  <circle cx="600" cy="250" r="52" fill="none" stroke="#f07010" stroke-width="2" stroke-dasharray="10 6" opacity=".5"/>
  <!-- Centres -->
  <circle cx="200" cy="250" r="28" fill="#0a1f38" stroke="#f07010" stroke-width="3"/>
  <circle cx="600" cy="250" r="22" fill="#0a1f38" stroke="#f07010" stroke-width="3"/>
  <circle cx="400" cy="120" r="18" fill="#0a1f38" stroke="#f07010" stroke-width="3"/>
  <text x="400" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#f07010" letter-spacing="6">DISTRIBUTION</text>
</svg>